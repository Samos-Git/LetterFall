<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MotGame">
<meta name="description" content="Jeu de mots - formez des mots français avec les lettres qui tombent">
<link rel="manifest" href="manifest.json">
<title>MotGame</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0f0e17;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --green: #22c97a;
    --orange: #f59e0b;
    --red: #ef4444;
    --text: #e8e6f0;
    --text2: #9993b8;
    --border: rgba(124,106,247,0.2);
    --cell-empty: rgba(255,255,255,0.03);
    --cell-placed: #22c97a;
    --cell-falling: #7c6af7;
    --cell-selected: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100dvh;
    padding: 8px 8px 12px;
    gap: 6px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  #hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 4px 2px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 60px;
  }
  .stat-label {
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
  }
  .stat-val {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }
  .stat-val.best { font-size: 14px; color: var(--accent2); }

  /* LEVEL BAR */
  #lvl-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #lvl-bar-bg {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  #lvl-bar-fill {
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .4s ease;
  }
  #lvl-label {
    font-size: 10px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }

  /* GRID */
  #grid-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* INFO BAR */
  #info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 2px;
  }
  #next-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .next-label {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
  }
  .next-cell {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    font-family: 'Space Mono', monospace;
  }
  .next-cell.a { background: var(--accent); color: #fff; }
  .next-cell.b { background: rgba(124,106,247,0.2); color: var(--accent2); }

  #limit-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  #limit-txt {
    font-size: 10px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
  }
  #limit-bar-bg2 {
    width: 90px; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  #limit-bar-fill2 {
    height: 3px;
    background: var(--green);
    border-radius: 2px;
    transition: width .3s, background .3s;
  }

  /* MSG */
  #msg {
    font-size: 11px;
    color: var(--text2);
    text-align: center;
    min-height: 14px;
    font-family: 'Space Mono', monospace;
  }
  #found-words {
    font-size: 11px;
    color: var(--accent2);
    text-align: center;
    min-height: 14px;
    max-width: 100%;
    word-break: break-word;
    font-weight: 600;
  }

  /* BUTTONS */
  #btn-row {
    display: flex;
    gap: 8px;
    width: 100%;
    justify-content: center;
  }
  .btn {
    flex: 1;
    max-width: 100px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .1s;
    user-select: none;
  }
  .btn:active { transform: scale(0.95); background: var(--surface2); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    flex: 1.5;
    max-width: 140px;
  }
  .btn.primary:active { background: #6555e0; }
  .btn.drop { font-size: 18px; }

  #btn-start {
    width: 100%;
    max-width: 200px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 12px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    letter-spacing: .05em;
    transition: background .15s;
  }
  #btn-start:active { background: var(--surface); }

  /* OVERLAY */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,14,23,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 32px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -.02em;
  }
  #overlay .sub {
    font-size: 13px;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    text-align: center;
    line-height: 1.6;
    max-width: 280px;
  }
  #overlay .score-display {
    font-size: 48px;
    font-weight: 800;
    color: var(--accent2);
  }
  #overlay .btn-play {
    padding: 14px 40px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    border: none;
    cursor: pointer;
    letter-spacing: .02em;
  }
  #overlay .btn-play:active { background: #6555e0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="overlay">
  <h1>MotGame</h1>
  <div class="sub">Déplace les lettres qui tombent<br>pour former des mots français.<br>Plus le mot est long, plus tu gagnes !</div>
  <div class="sub" style="color:var(--accent2);font-size:11px">
    2 lettres = 1pt &nbsp;·&nbsp; 3-5 lettres = 5pts &nbsp;·&nbsp; 6+ lettres = 10pts
  </div>
  <button class="btn-play" id="btn-play-overlay">Jouer</button>
</div>

<div id="app">
  <div id="hdr">
    <div class="stat"><span class="stat-label">Score</span><span class="stat-val" id="score">0</span></div>
    <div class="stat"><span class="stat-label">Meilleur</span><span class="stat-val best" id="best">0</span></div>
    <div class="stat"><span class="stat-label">Mots</span><span class="stat-val" id="words">0</span></div>
    <div class="stat"><span class="stat-label">Niveau</span><span class="stat-val" id="level">1</span></div>
  </div>

  <div id="lvl-wrap">
    <div id="lvl-bar-bg"><div id="lvl-bar-fill" style="width:0%"></div></div>
    <span id="lvl-label">0 / 100</span>
  </div>

  <div id="grid-wrap"><canvas id="gc"></canvas></div>

  <div id="info-bar">
    <div id="next-box">
      <span class="next-label">Suiv.</span>
      <div class="next-cell a" id="next1">?</div>
      <div class="next-cell b" id="next2">?</div>
    </div>
    <div id="limit-box">
      <span id="limit-txt">Limite : <span id="limit-rows">14</span> lignes</span>
      <div id="limit-bar-bg2"><div id="limit-bar-fill2" style="width:0%"></div></div>
    </div>
  </div>

  <div id="msg">Bienvenue !</div>
  <div id="found-words"></div>

  <div id="btn-row">
    <button class="btn" id="btn-clear">Effacer</button>
    <button class="btn drop" id="btn-drop">⬇︎</button>
    <button class="btn primary" id="btn-validate">Valider</button>
  </div>
  <button id="btn-start">Recommencer</button>
</div>

function n(s){
  return s.toLowerCase()
    .replace(/[éèêë]/g,'e').replace(/[àâä]/g,'a')
    .replace(/[ùûü]/g,'u').replace(/[îï]/g,'i')
    .replace(/[ôö]/g,'o').replace(/[ç]/g,'c')
    .replace(/œ/g,'oe').replace(/æ/g,'ae')
    .replace(/['\-\s]/g,'');
}

// ═══════════════════════════════════════════════════
// CONSTANTES JEU
// ═══════════════════════════════════════════════════
const LEVEL_LIMITS = [14,12,10,8,6];
function getLevelLimit(lvl){ return LEVEL_LIMITS[Math.min(lvl-1,LEVEL_LIMITS.length-1)]; }

const VOWELS = 'AEIOUAEIOUAEIOUYAEIOUY';
const CONS   = 'BCDFGHJKLMNPQRSTVWXZBCDFGHJKLMNPRSTVBCDFLMNRST';
function rndLetter(fv,fc){
  if(fv) return VOWELS[Math.floor(Math.random()*VOWELS.length)];
  if(fc) return CONS[Math.floor(Math.random()*CONS.length)];
  return Math.random()<0.40 ? VOWELS[Math.floor(Math.random()*VOWELS.length)] : CONS[Math.floor(Math.random()*CONS.length)];
}

let letterQueue=[], qTracker=[];
function refill(){
  while(letterQueue.length<6){
    const rv=qTracker.slice(-4).filter(l=>VOWELS.includes(l)).length;
    const rc=qTracker.slice(-4).filter(l=>!VOWELS.includes(l)).length;
    const l=(rv>=3)?rndLetter(false,true):(rc>=3)?rndLetter(true,false):rndLetter(false,false);
    letterQueue.push(l); qTracker.push(l);
    if(qTracker.length>20) qTracker.shift();
  }
}

// ═══════════════════════════════════════════════════
// CANVAS & GRILLE
// ═══════════════════════════════════════════════════
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');

let GCOLS=10, GROWS=14, CZ=28;

function resizeCanvas(){
  const wrap = document.getElementById('grid-wrap');
  const maxW = wrap.clientWidth;
  const maxH = wrap.clientHeight;
  CZ = Math.floor(Math.min(maxW/GCOLS, maxH/GROWS));
  gc.width  = GCOLS*CZ;
  gc.height = GROWS*CZ;
}

let grid=[], fallingLetter=null, fallingCol=0, fallingRow=0;
let score=0, wordCount=0, level=1, bestScore=0, running=false, gameOver=false;
let selectedCell=null, tickTimer=null;
let highlightWords=[], highlightTimeout=null;

const WORD_COLORS=[
  {bg:'#f59e0b',txt:'#1a1a2e'},
  {bg:'#38bdf8',txt:'#0c1a2e'},
  {bg:'#f472b6',txt:'#1a0a18'},
  {bg:'#4ade80',txt:'#0a1a10'},
  {bg:'#a78bfa',txt:'#1a0a2e'},
  {bg:'#fb923c',txt:'#1a0a00'},
];

function loadBest(){ try{ bestScore=parseInt(localStorage.getItem('mg_best')||'0')||0; }catch(e){} document.getElementById('best').textContent=bestScore; }
function saveBest(){ try{ localStorage.setItem('mg_best',bestScore); }catch(e){} }
function initGrid(){ grid=[]; for(let r=0;r<GROWS;r++) grid.push(Array(GCOLS).fill(null)); }
function getTopFilledRow(){ for(let r=0;r<GROWS;r++) if(grid[r].some(c=>c!==null)) return r; return GROWS; }
function countUsedRows(){ return GROWS-getTopFilledRow(); }
function checkGameOver(){ return countUsedRows()>getLevelLimit(level); }

function updateLimitBar(){
  const limit=getLevelLimit(level);
  const used=countUsedRows();
  const pct=Math.min(100,Math.round((used/limit)*100));
  document.getElementById('limit-rows').textContent=limit;
  const fill=document.getElementById('limit-bar-fill2');
  fill.style.width=pct+'%';
  fill.style.background=pct>=80?'#ef4444':pct>=60?'#f59e0b':'#22c97a';
}

function updateLevelBar(){
  const pct=score%100;
  document.getElementById('lvl-bar-fill').style.width=pct+'%';
  document.getElementById('lvl-label').textContent=pct+' / 100';
}

function updateNextDisplay(){
  refill();
  document.getElementById('next1').textContent=letterQueue[0]||'?';
  document.getElementById('next2').textContent=letterQueue[1]||'?';
}

function getCellHighlight(r,c){
  for(let i=0;i<highlightWords.length;i++)
    if(highlightWords[i].cells.some(([wr,wc])=>wr===r&&wc===c))
      return WORD_COLORS[i%WORD_COLORS.length];
  return null;
}

function drawGrid(){
  ctx.clearRect(0,0,gc.width,gc.height);

  // Fond
  ctx.fillStyle='#0f0e17';
  ctx.beginPath(); ctx.roundRect(0,0,gc.width,gc.height,10); ctx.fill();

  // Zone limite
  const limitRow=GROWS-getLevelLimit(level);
  if(limitRow>0){
    ctx.fillStyle='rgba(239,68,68,0.05)';
    ctx.fillRect(0,limitRow*CZ,gc.width,(GROWS-limitRow)*CZ);
    ctx.strokeStyle='rgba(239,68,68,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,limitRow*CZ); ctx.lineTo(gc.width,limitRow*CZ); ctx.stroke();
  }

  // Grille
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=.5;
  for(let r=0;r<GROWS;r++) for(let c=0;c<GCOLS;c++){
    ctx.strokeRect(c*CZ+.5,r*CZ+.5,CZ-1,CZ-1);
  }

  // Contours des mots en surbrillance
  if(highlightWords.length>0){
    highlightWords.forEach((hw,i)=>{
      const color=WORD_COLORS[i%WORD_COLORS.length];
      const rows=hw.cells.map(([r])=>r), cols=hw.cells.map(([,c])=>c);
      const minR=Math.min(...rows),maxR=Math.max(...rows);
      const minC=Math.min(...cols),maxC=Math.max(...cols);
      const x=minC*CZ+1,y=minR*CZ+1,w=(maxC-minC+1)*CZ-2,h=(maxR-minR+1)*CZ-2;
      ctx.fillStyle=color.bg+'22';
      ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.fill();
      ctx.strokeStyle=color.bg; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.stroke();
    });
  }

  // Cellules
  for(let r=0;r<GROWS;r++) for(let c=0;c<GCOLS;c++){
    const cell=grid[r][c];
    if(!cell) continue;
    const isSel=selectedCell&&selectedCell.r===r&&selectedCell.c===c;
    const hl=getCellHighlight(r,c);
    const x=c*CZ, y=r*CZ;
    ctx.fillStyle=isSel?'#f59e0b':hl?hl.bg:'#22c97a';
    ctx.beginPath(); ctx.roundRect(x+1,y+1,CZ-2,CZ-2,5); ctx.fill();
    ctx.fillStyle=isSel?'#1a1a2e':hl?hl.txt:'#0a1a10';
    ctx.font=`700 ${Math.round(CZ*.56)}px 'Space Mono', monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(cell,x+CZ/2,y+CZ/2+1);
  }

  // Ghost + lettre en chute
  if(fallingLetter&&running){
    let ghostRow=Math.floor(fallingRow);
    while(ghostRow+1<GROWS&&(!grid[ghostRow+1]||grid[ghostRow+1][fallingCol]===null)) ghostRow++;
    if(ghostRow!==Math.floor(fallingRow)){
      const gx=fallingCol*CZ, gy=ghostRow*CZ;
      ctx.fillStyle='rgba(124,106,247,0.12)';
      ctx.beginPath(); ctx.roundRect(gx+1,gy+1,CZ-2,CZ-2,5); ctx.fill();
      ctx.fillStyle='rgba(124,106,247,0.4)';
      ctx.font=`700 ${Math.round(CZ*.56)}px 'Space Mono', monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(fallingLetter,gx+CZ/2,gy+CZ/2+1);
    }
    const x=fallingCol*CZ, y=Math.floor(fallingRow)*CZ;
    ctx.fillStyle='#7c6af7';
    ctx.beginPath(); ctx.roundRect(x+1,y+1,CZ-2,CZ-2,5); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font=`700 ${Math.round(CZ*.56)}px 'Space Mono', monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fallingLetter,x+CZ/2,y+CZ/2+1);
  }

  // Game over overlay
  if(gameOver){
    ctx.fillStyle='rgba(15,14,23,0.85)';
    ctx.beginPath(); ctx.roundRect(0,0,gc.width,gc.height,10); ctx.fill();
    ctx.fillStyle='#e8e6f0';
    ctx.font=`800 ${Math.round(CZ*.8)}px 'Syne', sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('GAME OVER',gc.width/2,gc.height/2-CZ);
    ctx.font=`400 ${Math.round(CZ*.45)}px 'Space Mono', monospace`;
    ctx.fillStyle='#a78bfa';
    ctx.fillText('Score : '+score,gc.width/2,gc.height/2);
    ctx.fillStyle='#9993b8';
    ctx.fillText('Meilleur : '+bestScore,gc.width/2,gc.height/2+CZ*0.9);
  }
}

// ═══════════════════════════════════════════════════
// LOGIQUE JEU
// ═══════════════════════════════════════════════════
function dropNow(){
  if(!running||!fallingLetter) return;
  let r=Math.floor(fallingRow);
  while(r+1<GROWS&&(!grid[r+1]||grid[r+1][fallingCol]===null)) r++;
  fallingRow=r; land();
}

function spawnNext(){
  refill();
  fallingLetter=letterQueue.shift();
  updateNextDisplay();
  fallingCol=Math.floor(Math.random()*GCOLS);
  fallingRow=0;
  if(grid[0][fallingCol]!==null) doGameOver();
}

function doGameOver(){
  running=false; gameOver=true; fallingLetter=null;
  if(tickTimer) clearInterval(tickTimer);
  if(score>bestScore){ bestScore=score; saveBest(); }
  document.getElementById('best').textContent=bestScore;
  document.getElementById('msg').textContent='Appuie sur Recommencer !';
  drawGrid();
}

function land(){
  let r=Math.floor(fallingRow);
  while(r+1<GROWS&&(!grid[r+1]||grid[r+1][fallingCol]===null)) r++;
  grid[r][fallingCol]=fallingLetter;
  fallingLetter=null;
  updateLimitBar();
  if(checkGameOver()){ doGameOver(); return; }
  document.getElementById('msg').textContent='Déplace et forme des mots !';
  drawGrid();
  setTimeout(()=>{ if(running) spawnNext(); },300);
}

function tick(){
  if(!running||!fallingLetter) return;
  fallingRow+=0.10+(level-1)*0.02;
  const r=Math.floor(fallingRow);
  if(r>=GROWS-1||(grid[r+1]&&grid[r+1][fallingCol]!==null)) land();
  else drawGrid();
}

function applyGravity(){
  for(let c=0;c<GCOLS;c++){
    const col=[];
    for(let r=0;r<GROWS;r++) if(grid[r][c]!==null) col.push(grid[r][c]);
    for(let r=0;r<GROWS;r++) grid[r][c]=(r<GROWS-col.length)?null:col[r-(GROWS-col.length)];
  }
  drawGrid();
}

function getAllCandidates(){
  const candidates=[];
  function processRun(run){
    if(run.length<2) return;
    for(let s=0;s<run.length;s++){
      for(let len=2;len<=run.length-s;len++){
        const cells=run.slice(s,s+len);
        const letters=cells.map(([r,c])=>grid[r][c]);
        const w=n(letters.join(''));
        const wr=n([...letters].reverse().join(''));
        if(isWord(w)) candidates.push({word:letters.join(''),len,cells});
        else if(isWord(wr)) candidates.push({word:[...letters].reverse().join(''),len,cells});
      }
    }
  }
  for(let r=0;r<GROWS;r++){
    let run=[];
    for(let c=0;c<GCOLS;c++){
      if(grid[r][c]!==null) run.push([r,c]);
      else{ processRun(run); run=[]; }
    }
    processRun(run);
  }
  for(let c=0;c<GCOLS;c++){
    let run=[];
    for(let r=0;r<GROWS;r++){
      if(grid[r][c]!==null) run.push([r,c]);
      else{ processRun(run); run=[]; }
    }
    processRun(run);
  }
  candidates.sort((a,b)=>b.len-a.len);
  return candidates;
}

// ═══════════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════════
gc.addEventListener('click',e=>{
  if(!running||highlightWords.length>0) return;
  const rect=gc.getBoundingClientRect();
  const c=Math.floor((e.clientX-rect.left)*(gc.width/rect.width)/CZ);
  const r=Math.floor((e.clientY-rect.top)*(gc.height/rect.height)/CZ);
  if(c<0||c>=GCOLS||r<0||r>=GROWS) return;
  if(selectedCell){
    if(grid[r][c]===null){
      grid[r][c]=selectedCell.letter;
      grid[selectedCell.r][selectedCell.c]=null;
      applyGravity(); updateLimitBar(); selectedCell=null;
      document.getElementById('msg').textContent='Lettre déplacée !';
    } else if(r===selectedCell.r&&c===selectedCell.c){
      selectedCell=null;
      document.getElementById('msg').textContent='Sélection annulée.';
    } else {
      selectedCell={r,c,letter:grid[r][c]};
      document.getElementById('msg').textContent='→ Tap une case vide pour placer '+grid[r][c];
    }
    drawGrid(); return;
  }
  if(grid[r][c]!==null){
    selectedCell={r,c,letter:grid[r][c]};
    document.getElementById('msg').textContent='→ Tap une case vide pour placer '+grid[r][c];
    drawGrid();
  }
});

// Touch support
gc.addEventListener('touchstart',e=>{ e.preventDefault(); gc.dispatchEvent(new MouseEvent('click',{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY})); },{passive:false});

document.getElementById('btn-validate').addEventListener('click',()=>{
  if(!running||highlightWords.length>0) return;
  selectedCell=null;
  const candidates=getAllCandidates();
  const usedKeys=new Set();
  const validated=[];
  for(const fw of candidates){
    if(!fw.cells.some(([r,c])=>usedKeys.has(r+','+c))){
      fw.cells.forEach(([r,c])=>usedKeys.add(r+','+c));
      validated.push(fw);
    }
  }
  if(validated.length===0){
    document.getElementById('found-words').textContent='Aucun mot trouvé !';
    document.getElementById('msg').textContent='Réorganise les lettres…';
    drawGrid(); return;
  }
  let pts=0;
  validated.forEach(({len})=>{ pts+=len===2?1:len<=5?5:10; });
  score+=pts; wordCount+=validated.length;
  const oldLevel=level;
  level=Math.floor(score/100)+1;
  if(score>bestScore){ bestScore=score; saveBest(); }
  document.getElementById('score').textContent=score;
  document.getElementById('words').textContent=wordCount;
  document.getElementById('best').textContent=bestScore;
  document.getElementById('level').textContent=level;
  document.getElementById('found-words').textContent=validated.map(fw=>{
    const p=fw.len===2?1:fw.len<=5?5:10;
    return fw.word+' +'+p;
  }).join('  ·  ');
  document.getElementById('msg').textContent=level>oldLevel
    ? '🎉 Niveau '+level+' ! Limite : '+getLevelLimit(level)+' lignes'
    : '+'+pts+' points !';
  updateLevelBar();

  highlightWords=validated; drawGrid();
  if(highlightTimeout) clearTimeout(highlightTimeout);
  highlightTimeout=setTimeout(()=>{
    highlightWords=[];
    usedKeys.forEach(k=>{ const[r,c]=k.split(',').map(Number); grid[r][c]=null; });
    applyGravity(); updateLimitBar();
    if(checkGameOver()) doGameOver();
  },2000);
});

document.getElementById('btn-drop').addEventListener('click', dropNow);
document.getElementById('btn-clear').addEventListener('click',()=>{
  if(!running||highlightWords.length>0) return;
  selectedCell=null; initGrid();
  document.getElementById('found-words').textContent='';
  document.getElementById('msg').textContent='Grille effacée !';
  updateLimitBar(); drawGrid();
});

function startGame(){
  if(highlightTimeout){ clearTimeout(highlightTimeout); highlightTimeout=null; }
  highlightWords=[];
  initGrid(); letterQueue=[]; qTracker=[]; refill();
  score=0; wordCount=0; level=1; gameOver=false; running=true;
  selectedCell=null; fallingLetter=null;
  document.getElementById('score').textContent='0';
  document.getElementById('words').textContent='0';
  document.getElementById('level').textContent='1';
  document.getElementById('found-words').textContent='';
  document.getElementById('msg').textContent='Déplace les lettres et forme des mots !';
  updateLimitBar(); updateLevelBar(); updateNextDisplay();
  resizeCanvas(); drawGrid();
  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(tick,50);
  spawnNext();
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-play-overlay').addEventListener('click',()=>{
  document.getElementById('overlay').classList.add('hidden');
  startGame();
});

document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); dropNow(); }
});

window.addEventListener('resize',()=>{ resizeCanvas(); drawGrid(); });

// Init
loadBest();
resizeCanvas();
drawGrid();
</script>
